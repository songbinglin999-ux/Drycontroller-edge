# SIMULATOR PROFILE - run the full edge stack against a Modbus slave simulator
# (no PLC hardware needed). Not for production.
#
#   cp env.example .env   # then replace every change_me_* value
#   docker compose -f docker-compose.yml -f docker-compose.sim.yml up -d --build \
#       postgres influxdb mosquitto modbus-sim edge-api edge-daq
#
# The simulator (services/edge-daq/modbus_slave_sim.py) serves the read points of
# configs/modbus-address-map.yaml with time-varying raw values, RTU-over-TCP,
# port 2022, unit 1. It does not implement write/handshake registers.
services:
  modbus-sim:
    image: docker.io/library/python:3.11-slim
    container_name: modbus-sim
    command: >
      sh -c "pip install --no-cache-dir --disable-pip-version-check pymodbus==3.5.4 >/dev/null
             && python /sim/modbus_slave_sim.py"
    environment:
      - MODBUS_SIM_HOST=0.0.0.0
      - MODBUS_SIM_PORT=2022
      - MODBUS_SIM_SLAVE=1
      - MODBUS_SIM_INTERVAL=1.0
    volumes:
      - ./services/edge-daq/modbus_slave_sim.py:/sim/modbus_slave_sim.py:ro
    networks:
      - edge-network
    restart: unless-stopped

  edge-daq:
    environment:
      - PLC_HOST=modbus-sim
      - PLC_PORT=2022
      - PLC_SLAVE_ID=1
      - MODBUS_FRAMER=rtu
      - USE_SIMULATOR=false
    depends_on:
      - modbus-sim
