# Alembic configuration for edge-api.
#
# Phase A (P1-5): tool installed but not yet wired into startup.
# See docs/ops/db-migrations.md for usage.

[alembic]
# Path to migration scripts (relative to this file).
script_location = alembic

# Prepend the project root to sys.path so `from app.core.database import Base` works.
prepend_sys_path = .

# Use OS-local time for "Create Date" comments in generated migrations.
timezone =

# Database URL is set dynamically in env.py from app.core.config.settings.database_url.
# Leaving this here as a placeholder so `alembic current` works without env vars.
sqlalchemy.url = postgresql+asyncpg://edge_user:edge_password@localhost:5432/edge_db


[post_write_hooks]


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
