# Mosquitto MQTT Broker 配置

# ==================== 监听配置 ====================
listener 1883
protocol mqtt

# WebSocket 监听
listener 9001
protocol websockets

# ==================== 网络配置 ====================
max_connections -1
max_keepalive 65535

# ==================== 持久化配置 ====================
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# ==================== 日志配置 ====================
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ==================== 安全配置 ====================
allow_anonymous false
# 密码文件/证书属于敏感材料：不放在仓库里，运行时由 init 容器生成并写入 secrets volume
password_file /mosquitto/secret/passwords
# 最小权限：按用户限制可订阅/可发布的 topic
#
# 注意：/mosquitto/config 由宿主机只读挂载，属主/权限通常是 root:root，
# 新版 mosquitto 会拒绝加载（安全策略升级）。因此启动时由 entrypoint 复制到可写的 /mosquitto/data 并 chown。
acl_file /mosquitto/data/acl

# ==================== 消息配置 ====================
max_queued_messages 1000
max_inflight_messages 20
#max_packet_size 268435455  # Mosquitto 2.0+ 可选参数，保持默认

# ==================== QoS 配置 ====================
max_qos 2
upgrade_outgoing_qos false

# ==================== 保留消息配置 ====================
retained_persistence true
#max_retained_messages 1000

# ==================== 性能优化 ====================
set_tcp_nodelay true

# ==================== $SYS（用于健康检查）====================
# docker-compose healthcheck 会订阅 $SYS/broker/uptime；需要确保间隔小于 healthcheck 超时窗口
sys_interval 5

