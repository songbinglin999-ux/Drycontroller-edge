# Mosquitto MQTT Broker TLS 配置（生产建议）
#
# 说明：
# - 仅监听 TLS 端口，避免明文暴露
# - 证书放在 /mosquitto/secret/certs（由现场挂载或 init 生成）
#
# 端口约定：
# - MQTT TLS: 8883
# - MQTT over WSS: 9002

# ==================== TLS 监听配置 ====================
listener 8883
protocol mqtt

listener 9002
protocol websockets

# ==================== 网络配置 ====================
max_connections -1
max_keepalive 65535
set_tcp_nodelay true

# ==================== TLS 证书 ====================
cafile /mosquitto/secret/certs/ca.crt
certfile /mosquitto/secret/certs/server.crt
keyfile /mosquitto/secret/certs/server.key

# 如果你们使用双向认证（mTLS），可开启：
# require_certificate true
# use_identity_as_username true

# ==================== 持久化配置 ====================
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# ==================== 日志配置 ====================
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ==================== 安全配置 ====================
allow_anonymous false
password_file /mosquitto/secret/passwords
acl_file /mosquitto/config/acl

# ==================== QoS 配置 ====================
max_qos 2
upgrade_outgoing_qos false

# ==================== 保留消息配置 ====================
retained_persistence true


