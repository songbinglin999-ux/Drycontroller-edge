groups:
  - name: ai-softsensor-quality
    rules:
      - alert: AISoftsensorInfluxDisconnected
        expr: softsensor_influx_connected == 0
        for: 2m
        labels:
          severity: critical
          service: ai-softsensor
        annotations:
          summary: "ai-softsensor Influx 写入通路不可用"
          description: "ai-softsensor 无法写入 InfluxDB（influx_connected=0）持续 2 分钟以上。"

      - alert: AISoftsensorInferenceStalled
        expr: (time() - softsensor_inference_last_ts) > 120
        for: 2m
        labels:
          severity: critical
          service: ai-softsensor
        annotations:
          summary: "ai-softsensor 推理停摆"
          description: "最近一次推理成功距今超过 120 秒（可能输入缺失/数据过期/冻结/服务异常）。"

      - alert: AISoftsensorFeatureStaleDetected
        expr: sum(increase(softsensor_feature_stale_total[5m])) > 0
        for: 1m
        labels:
          severity: warning
          service: ai-softsensor
        annotations:
          summary: "ai-softsensor 检测到输入特征过期"
          description: "5 分钟内出现输入特征过期，软测量结果可能不可信。"

      - alert: AISoftsensorFeatureFrozenHigh
        expr: sum(increase(softsensor_feature_frozen_total[10m])) > 10
        for: 2m
        labels:
          severity: warning
          service: ai-softsensor
        annotations:
          summary: "ai-softsensor 特征冻结频繁"
          description: "10 分钟内特征冻结累计超过 {{ $value }} 次，可能存在传感器冻结/链路卡住。"

      - alert: AISoftsensorInferenceFailures
        expr: increase(softsensor_inference_failed_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
          service: ai-softsensor
        annotations:
          summary: "ai-softsensor 推理失败"
          description: "5 分钟内出现推理失败 {{ $value }} 次。"

      - alert: AISoftsensorMqttOutboxBacklog
        expr: softsensor_ai_outbox_size > 100
        for: 5m
        labels:
          severity: warning
          service: ai-softsensor
        annotations:
          summary: "ai-softsensor 推理结果 MQTT outbox 堆积"
          description: "推理结果 outbox 堆积 {{ $value }} 条，可能 MQTT 不通或发布失败。"

      - alert: AISoftsensorInfluxBufferBacklog
        expr: softsensor_influx_buffer_size > 500
        for: 5m
        labels:
          severity: warning
          service: ai-softsensor
        annotations:
          summary: "ai-softsensor Influx 缓冲堆积"
          description: "Influx 缓冲堆积 {{ $value }} 条，可能 Influx 不通或写入失败。"


