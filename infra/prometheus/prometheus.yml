global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: "edge-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["edge-api:8000"]

  - job_name: "edge-daq"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["edge-daq:8080"]

  - job_name: "ai-softsensor"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["ai-softsensor:8080"]

  - job_name: "ai-ctrl-optimizer"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["ai-ctrl-optimizer:8080"]

  - job_name: "edge-monitor"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["edge-monitor:8080"]

  - job_name: "license-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["license-service:8000"]

  # edge-ota-agent runs only with `--profile ota`. When that profile is not
  # active the target will be DOWN; that's expected and not an alert condition.
  - job_name: "edge-ota-agent"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["edge-ota-agent:8090"]


