global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

rule_files:
  - /etc/prometheus/rules/edge-api.yml
  - /etc/prometheus/rules/edge-daq.yml
  - /etc/prometheus/rules/edge-services-health.yml

scrape_configs:
  - job_name: "edge-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["edge-api:8000"]

  - job_name: "edge-daq"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["edge-daq:8080"]

  - job_name: "edge-monitor"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["edge-monitor:8080"]
