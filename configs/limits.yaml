# 工艺限制和报警配置
#
# 与 configs/tags.yaml 和 docs/plc/io-map.html 的当前位号保持一致。
# 本文件只描述 edge 可用于告警/展示的建议阈值；PLC 安全联锁和
# operator-touch 软设定值不在这里定义。

line_id: L1
contract_source:
  tags: configs/tags.yaml
  io_map: docs/plc/io-map.html

# ==================== 模拟量建议阈值 ====================
advisory_limits:
  drying_temperature:
    FTT1:
      unit: "℃"
      min: 20
      max: 180
      alarm_high: 170
      alarm_low: 30
    FTT2:
      unit: "℃"
      min: 20
      max: 180
      alarm_high: 170
      alarm_low: 30
    FTT3:
      unit: "℃"
      min: 20
      max: 180
      alarm_high: 170
      alarm_low: 30

  boiler_temperature:
    TT1:
      unit: "℃"
      min: 50
      max: 300
      alarm_high: 280
    TT2:
      unit: "℃"
      min: 50
      max: 300
      alarm_high: 280

  moisture:
    MT1:
      unit: "%"
      target: 12.0
      tolerance: 2.0
      min_acceptable: 8.0
      max_acceptable: 16.0
      alarm_high: 18.0
      alarm_low: 6.0

  motor_current:
    defaults:
      unit: "A"
      normal_range: [0, 60]
      warning: 75
      critical: 90
      max_allowed: 100
    tags:
      - I_M1
      - I_M2
      - I_M3
      - I_M4
      - I_M5
      - I_M6
      - I_M7
      - I_M8
      - I_M9
      - I_M10
      - I_M11
      - I_M12
      - I_M13
      - I_M14
      - I_M15
      - I_M16

  variable_frequency_feedback:
    defaults:
      unit: "%/Hz"
      min: 0
      max: 100
      warning_high: 95
    tags:
      - VFM1
      - VFM2
      - VFM3

# ==================== 开关量期望 ====================
digital_states:
  level_switches:
    tags:
      - LL1
      - LL2
      - LL3
      - LL4
      - LL5
      - LL6
    expected_type: bool

  motor_status:
    tags:
      - M1
      - M2
      - M3
      - M4
      - M5
      - M6
      - M7
      - M8
      - M9
      - M10
      - M11
      - M12
      - M13
      - M14
      - M15
      - M16
    expected_type: bool

  variable_frequency_outputs:
    tags:
      - VF1
      - VF2
      - VF3
    expected_type: bool

# ==================== 报警配置 ====================
alarms:
  priorities:
    info:
      level: 0
      color: "blue"
      action: "log"

    warning:
      level: 1
      color: "yellow"
      action: "notify"
      auto_clear: true

    error:
      level: 2
      color: "orange"
      action: "notify+log"
      requires_acknowledgment: true

    critical:
      level: 3
      color: "red"
      action: "notify+log"
      requires_acknowledgment: true
      escalation_time: 300

  rules:
    - name: "干燥温度高限"
      tags: [FTT1, FTT2, FTT3]
      condition: "value > alarm_high"
      priority: "error"
      cooldown: 60

    - name: "干燥温度低限"
      tags: [FTT1, FTT2, FTT3]
      condition: "value < alarm_low"
      priority: "warning"
      cooldown: 60

    - name: "锅炉温度高限"
      tags: [TT1, TT2]
      condition: "value > alarm_high"
      priority: "error"
      cooldown: 60

    - name: "电机电流过载"
      tags:
        - I_M1
        - I_M2
        - I_M3
        - I_M4
        - I_M5
        - I_M6
        - I_M7
        - I_M8
        - I_M9
        - I_M10
        - I_M11
        - I_M12
        - I_M13
        - I_M14
        - I_M15
        - I_M16
      condition: "value > critical"
      priority: "critical"

    - name: "变频反馈高限"
      tags: [VFM1, VFM2, VFM3]
      condition: "value >= warning_high"
      priority: "warning"
      cooldown: 60

    - name: "含水率异常"
      tags: [MT1]
      condition: "value > alarm_high OR value < alarm_low"
      priority: "warning"

    - name: "PLC 通信故障"
      condition: "plc_connection_lost"
      priority: "critical"

# ==================== 联锁与控制边界 ====================
interlocks:
  responsibility: "PLC-side"
  edge_actions:
    - "publish_alarm"
    - "surface_operator_ack"
  note: "edge 只暴露告警和确认状态，不在此文件定义安全动作。"

control_constraints:
  status: "deferred_to_operator_touch_softpoints"
  note: "控制设定值待 operator-touch 软点位定稿后单独建模。"

recommended_parameters:
  status: "not_configured"
  reason: "当前位号契约只覆盖采集和状态量，工艺推荐参数尚未形成可执行配置。"
