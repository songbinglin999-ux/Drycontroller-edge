# SIMULATOR ONLY —— 由集成商真实点表「数据点位表.csv」的「读」点（D 字寄存器）派生。
# 仅供 Modbus 从站模拟器联调；不是 SSOT。真机点位语义仍以 tags.yaml + io-map 为准。
# 用法：TAGS_CONFIG=/app/configs/tags.sim.yaml 搭配 modbus-address-map.sim.yaml。
# 名称直接用 PLC 元件号 D{n}（不自造位号）；signal_type=AI（模拟量读）。
# 数据格式（集成商）：电流/温度/频率=无符号 16-bit 单字（type int）；湿度 D45=带符号 32 位
# （type int32，占 40045+40046 两寄存器，字序待真机确认）。工程量 scale 见 address-map（电流/温度×0.1、频率 1:1、湿度 TBD）。
naming:
  format: "D{n}"
tags:
  process:
    current:
      - {name: D0, signal_type: AI, type: int, unit: "A", description: "绞龙1电机电流"}
      - {name: D1, signal_type: AI, type: int, unit: "A", description: "绞龙2电机电流"}
      - {name: D2, signal_type: AI, type: int, unit: "A", description: "预发酵进料电机电流"}
      - {name: D3, signal_type: AI, type: int, unit: "A", description: "预发酵出料电机电流"}
      - {name: D4, signal_type: AI, type: int, unit: "A", description: "预发酵主电机电流"}
      - {name: D5, signal_type: AI, type: int, unit: "A", description: "一级烘干进料电机电流"}
      - {name: D6, signal_type: AI, type: int, unit: "A", description: "一级烘干出料电机电流"}
      - {name: D7, signal_type: AI, type: int, unit: "A", description: "一级烘干主电机电流"}
      - {name: D8, signal_type: AI, type: int, unit: "A", description: "发酵进料电机电流"}
      - {name: D9, signal_type: AI, type: int, unit: "A", description: "发酵电机电流"}
      - {name: D10, signal_type: AI, type: int, unit: "A", description: "发酵出料电机电流"}
      - {name: D11, signal_type: AI, type: int, unit: "A", description: "二级烘干进料电机电流"}
      - {name: D12, signal_type: AI, type: int, unit: "A", description: "二级烘干出料电机电流"}
      - {name: D13, signal_type: AI, type: int, unit: "A", description: "二级烘干主电机电流"}
      - {name: D14, signal_type: AI, type: int, unit: "A", description: "滚筛进料电机电流"}
      - {name: D15, signal_type: AI, type: int, unit: "A", description: "滚筛出料电机电流"}
      - {name: D16, signal_type: AI, type: int, unit: "A", description: "最终出料电机电流"}
      - {name: D17, signal_type: AI, type: int, unit: "A", description: "1级风机电机电流"}
      - {name: D18, signal_type: AI, type: int, unit: "A", description: "2级风机电机电流"}
      - {name: D19, signal_type: AI, type: int, unit: "A", description: "3级风机电机电流"}
      - {name: D20, signal_type: AI, type: int, unit: "A", description: "1级烘干上料电机电流"}
      - {name: D21, signal_type: AI, type: int, unit: "A", description: "2级烘干上料电机电流"}
    frequency:
      - {name: D30, signal_type: AI, type: int, unit: "Hz", description: "预发酵进料电机运行频率"}
      - {name: D31, signal_type: AI, type: int, unit: "Hz", description: "第一级烘干进料电机运行频率"}
      - {name: D32, signal_type: AI, type: int, unit: "Hz", description: "第二级烘干进料电机运行频率"}
      - {name: D33, signal_type: AI, type: int, unit: "Hz", description: "1号风机运行频率"}
      - {name: D34, signal_type: AI, type: int, unit: "Hz", description: "2号风机运行频率"}
      - {name: D35, signal_type: AI, type: int, unit: "Hz", description: "3号风机运行频率"}
    temperature:
      - {name: D40, signal_type: AI, type: int, unit: "℃", description: "1号风机检测温度"}
      - {name: D41, signal_type: AI, type: int, unit: "℃", description: "2号风机检测温度"}
      - {name: D42, signal_type: AI, type: int, unit: "℃", description: "3号风机检测温度"}
      - {name: D43, signal_type: AI, type: int, unit: "℃", description: "一级烘干温度"}
      - {name: D44, signal_type: AI, type: int, unit: "℃", description: "二级烘干温度"}
    humidity:
      - {name: D45, signal_type: AI, type: int32, unit: "%", description: "实时湿度（带符号32位，跨2寄存器）"}
