# AI 模型配置文件

# ==================== 软测量模型配置 ====================
softsensor:
  model_name: "moisture-predictor"
  model_version: "v1.0.0"
  model_path: "/app/models/softsensor.onnx"
  
  # 输入特征：50 I/O 位号来自 configs/tags.yaml；MT1 是弱参考特征，非锚定 label。
  input_features:
    - FTT1
    - FTT2
    - FTT3
    - TT1
    - TT2
    - I_M1
    - I_M2
    - I_M3
    - I_M4
    - I_M5
    - I_M6
    - I_M7
    - I_M8
    - I_M9
    - I_M10
    - I_M11
    - I_M12
    - I_M13
    - I_M14
    - I_M15
    - I_M16
    - VFM1
    - VFM2
    - VFM3
    - VF1
    - VF2
    - VF3
    - LL1
    - LL2
    - LL3
    - LL4
    - LL5
    - LL6
    - M1
    - M2
    - M3
    - M4
    - M5
    - M6
    - M7
    - M8
    - M9
    - M10
    - M11
    - M12
    - M13
    - M14
    - M15
    - M16
    - MT1
    
  # 输出
  output:
    name: "MOISTURE.PREDICTED"
    unit: "%"
    range: [0, 100]
    target: 12.0
    
  # 预处理配置
  preprocessing:
    method: "standard"  # standard / minmax / robust
    scaler_path: "/app/models/scaler.pkl"
    
  # 推理配置
  inference:
    batch_size: 1
    timeout: 0.5  # 秒
    min_confidence: 0.7
    
  # 发布配置
  publish:
    mqtt_topic: "ai/{line}/moisture"
    interval: 5.0  # 秒
    
# ==================== 控制优化模型配置 ====================
optimizer:
  model_name: "control-optimizer"
  model_version: "v1.0.0"
  model_path: "/app/models/optimizer.onnx"
  
  # 优化目标
  objectives:
    - name: "moisture_target"
      target: 12.0  # 目标含水率 %
      weight: 1.0
      
    - name: "energy_cost"
      minimize: true
      weight: 0.3
      
  # 控制变量：V1 固定六频率目标；AI optimizer 仍为 V2/V3，等 EDGE-V2-P3 定义后再填。
  control_variables: []
  control_variable_notes:
    - "V1 write targets are VFM1-3_FREQ_SP / VF1-3_FREQ_SP via MANUAL or AUTO mode authorization."
    - "TBD V2/V3: optimizer-controlled fan/feed setpoint soft points."
      
  # 约束条件
  constraints:
    - type: "temperature"
      tag: "FTT1"
      max: null
      
    - type: "temperature"
      tag: "FTT2"
      max: null
      
    - type: "temperature"
      tag: "FTT3"
      max: null
      
    - type: "temperature"
      tag: "TT1"
      max: null

    - type: "temperature"
      tag: "TT2"
      max: null

    - type: "motor_current"
      tag_prefix: "I_M"
      tags: [I_M1, I_M2, I_M3, I_M4, I_M5, I_M6, I_M7, I_M8, I_M9, I_M10, I_M11, I_M12, I_M13, I_M14, I_M15, I_M16]
      max: null

    - type: "drive_feedback"
      tags: [VFM1, VFM2, VFM3, VF1, VF2, VF3]
      max: null
      
  # 优化配置
  optimization:
    algorithm: "pso"  # pso / genetic / gradient
    max_iterations: 100
    population_size: 30
    convergence_threshold: 0.01
    
  # 执行配置
  execution:
    mode: "advisory"  # advisory / auto
    interval: 60  # 秒
    confidence_threshold: 0.8
    
  # 发布配置
  publish:
    mqtt_topic: "ai/{line}/control"
    
# ==================== 模型训练配置 ====================
training:
  data_source: "influxdb"
  lookback_days: 90
  train_test_split: 0.8
  validation_split: 0.1
  
  hyperparameters:
    learning_rate: 0.001
    epochs: 100
    batch_size: 32
    early_stopping_patience: 10
    
# ==================== 模型评估指标 ====================
metrics:
  softsensor:
    - mae  # 平均绝对误差
    - rmse  # 均方根误差
    - r2_score  # R² 分数
    
  optimizer:
    - objective_value
    - constraint_violations
    - convergence_time
