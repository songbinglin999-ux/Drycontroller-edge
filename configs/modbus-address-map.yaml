# PLC Modbus address skeleton. Most values are intentionally TBD until the PLC
# integrator confirms register addresses, scaling, and byte order.
#
# Two kinds of entries:
#   - 52 read points below (function_code 3, read-only feedback / process I/O).
#   - 6 control write soft points at the bottom (writable: true, function_code 6).
# edge-daq's control write path resolves register address/scale/byte_order from
# the writable entries here; read points are consumed by the acquisition path.
# Soft point range/unit mirror edge-api ALLOWED_CONTROL_SOFTPOINTS as an
# independent edge-daq range guard (defense in depth, see P0-CTRL-NAK).
