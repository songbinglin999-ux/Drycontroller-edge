# --- V0/V1 diagnostic heartbeat points ---
# PLC_HEARTBEAT is read from PLC to prove PLC-side communication freshness.
# It may be a 0/1 mirror of the existing PLC heartbeat toggle; edge only
# requires the value to change, not a PLC-side incrementing counter. Because
# the current toggle is 0.5s high / 0.5s low, edge confirms change in a short
# burst window instead of relying on a single 5s sample.
# EDGE_HOST_ALIVE is written by edge to prove edge/daq-side communication
# freshness only. It is intentionally not an ALLOWED_CONTROL_SOFTPOINTS entry.
# PLC_LEGACY_HEARTBEAT_TOGGLE 对应集成商 M1001「0.5秒1/0.5秒0 心跳」。
# 该点只作为上位机只读诊断心跳，兼容现场旧口径；地址保持 TBD，
# 等 SamSoar/现场测试确认 M 线圈 Modbus 地址基准后再启用采集。
# PLC V1 single-heartbeat overlay 已分配：PLC_HEARTBEAT=D5290,
# EDGE_HOST_ALIVE=D5291。按本文件 D 字约定回填为 4x45290/4x45291；
# 现场验收仍需核对 PLC 4x 地址基准。
PLC_HEARTBEAT: {address: 45290, function_code: 3, scale: 1, byte_order: big, type: int, diagnostic: heartbeat}
EDGE_HOST_ALIVE: {address: 45291, function_code: 6, scale: 1, byte_order: big, writable: true, type: int, diagnostic: heartbeat, control_softpoint: false}
PLC_LEGACY_HEARTBEAT_TOGGLE: {address: TBD, function_code: 1, byte_order: big, type: bool, diagnostic: heartbeat, legacy_device: M1001, control_softpoint: false}

# --- V1 control write soft points (6 frequency setpoints) ---
# 控制写入按 2026-06-20「上位机降级全只读」决策锁停（见根目录 architecture-audit），本期不启用。
# D30-D35/M1000/M140-M173 属于 PLC 原工程/PLC 屏侧旧链路，DryController 不采集、不写入。
# 六频率只走 D5100-D5299 事务：先写 D5110-D5115 payload，最后写 D5100 请求序号，
# 再由 PLC ACK/NAK 与 D5210-D5225 状态读回确认；禁止单 tag 直写 D5110-D5115。
VFM1_FREQ_SP: {address: TBD, function_code: 6, scale: TBD, byte_order: big, writable: false, type: int, range: [0.0, 50.0], unit: Hz}
VFM2_FREQ_SP: {address: TBD, function_code: 6, scale: TBD, byte_order: big, writable: false, type: int, range: [0.0, 50.0], unit: Hz}
