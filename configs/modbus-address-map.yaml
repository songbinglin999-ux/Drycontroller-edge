# --- V0 diagnostic heartbeat points ---
# PLC_HEARTBEAT is read from PLC to prove PLC-side communication freshness.
# EDGE_HOST_ALIVE is written by edge to prove edge/daq-side communication
# freshness only. It is intentionally not an ALLOWED_CONTROL_SOFTPOINTS entry.
PLC_HEARTBEAT: {address: TBD, function_code: 3, scale: 1, byte_order: big, type: int, diagnostic: heartbeat}
EDGE_HOST_ALIVE: {address: TBD, function_code: 6, scale: 1, byte_order: big, writable: true, type: int, diagnostic: heartbeat, control_softpoint: false}

# --- V1 control write soft points (6 frequency setpoints) ---
# WRITE targets, distinct from the read-only VFM*/VF* feedback points above.
# PLC-side V1 SP registers are D30-D35, exposed over Modbus TCP as 4x40030-4x40035.
# scale stays TBD until PLC signs off the engineering-unit conversion; until then
# edge-daq fail-closes every write (NAK address_not_configured).
VFM1_FREQ_SP: {address: 40030, function_code: 6, scale: TBD, byte_order: big, writable: true, type: int, range: [0.0, 50.0], unit: Hz}
VFM2_FREQ_SP: {address: 40031, function_code: 6, scale: TBD, byte_order: big, writable: true, type: int, range: [0.0, 50.0], unit: Hz}
VFM3_FREQ_SP: {address: 40032, function_code: 6, scale: TBD, byte_order: big, writable: true, type: int, range: [0.0, 50.0], unit: Hz}
VF1_FREQ_SP: {address: 40033, function_code: 6, scale: TBD, byte_order: big, writable: true, type: int, range: [0.0, 50.0], unit: Hz}
VF2_FREQ_SP: {address: 40034, function_code: 6, scale: TBD, byte_order: big, writable: true, type: int, range: [0.0, 50.0], unit: Hz}
VF3_FREQ_SP: {address: 40035, function_code: 6, scale: TBD, byte_order: big, writable: true, type: int, range: [0.0, 50.0], unit: Hz}
