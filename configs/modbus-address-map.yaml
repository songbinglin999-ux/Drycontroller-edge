# PLC Modbus 地址表。读点已按 2026-06-20 集成商真实点表 + 系统唯一编号对账回填真实地址。
#
# 通讯：Modbus RTU-over-TCP（端口 2022，站号 1），非标准 Modbus TCP/502（MODBUS_FRAMER=rtu）。
# D 字读点：地址 = 40000 + D 序号；电流/温度无符号16位×0.1、频率1:1、湿度 int32 低字在前（little）。
# 料位/限位：X 线圈，function_code 1（0x01 读），地址 = X 偏移 0；bool。
# 仍需现场最终核对：地址基准（D0=40000 vs 4x、X 线圈 0 vs 参考号）、int32 字序。
# Y 运行状态 / M 报警仍未对账、本期不采。type/unit 以 tags.yaml 为准。
#
# --- D 字读点（34）---
# 电流 D0-D21（无符号16位 ×0.1 A）
