# PLC Modbus 地址表。读点已按 2026-06-20 集成商真实点表 + 系统唯一编号对账回填真实地址。
#
# 通讯：Modbus RTU-over-TCP（RTU 帧 + TCP，端口 2022，站号 1），非标准 Modbus TCP/502（MODBUS_FRAMER=rtu）。
# 读点：D 元件，Modbus 地址 = 40000 + D 序号（D0=40000）。量程/格式：
#   电流/温度 = 无符号 16-bit，原始×10（scale 0.1）；频率 = 无符号 16-bit，1:1；
#   湿度 = 带符号 int32（占 40045-40046），低字在前（byte_order little），scale 仍 TBD。
# 仍需现场最终核对：地址基准（D0=原始 40000 还是 4x 参考号、差 40001）、int32 字序。
# 位元件（料位 X / 报警 M300-M323 / 电机状态 Y）是 0x01/0x02 线圈，edge 读路径暂不支持，本期不采。
# type/unit 以 tags.yaml 为准；本表只提供 address/function_code/scale/byte_order（read 合并用）。
#
# --- 读点（34，canonical = 系统编号_量纲）---
# 电流 D0-D21（无符号16-bit ×0.1 A）
M1_I: {address: 40000, function_code: 3, scale: 0.1, byte_order: big}
M2_I: {address: 40001, function_code: 3, scale: 0.1, byte_order: big}
