# 全栈位号契约：canonical = 系统唯一编号 + 量纲后缀（_I 电流 / _FREQ 频率 / _T 温度 / _H 湿度）。
# 2026-06-20 对账自集成商真实点表（D 元件）；系统编号对照见 ../../plc-tag-mapping/。
# 34 个只读采集点；地址/scale/字序/类型外置在 modbus-address-map.yaml。控制软点单列、且按只读决策锁停。
naming:
  format: "{SYSTEM_ID}_{KIND}"
  allowed_pattern: "^[A-Z0-9_]+$"
  notes:
    - "量纲后缀解决了设备号撞车：同一设备的电流与频率（如 VFM1_I / VFM1_FREQ）不再共用一个名。"
    - "type=int 为无符号 16-bit 单字；type=int32 为带符号双字（湿度，低字在前）。"
tags:
  process:
    current:
      - {name: M1_I, signal_type: AI, type: int, unit: "A", description: "绞龙1电机电流（D0）"}
      - {name: M2_I, signal_type: AI, type: int, unit: "A", description: "绞龙2电机电流（D1）"}
      - {name: VFM1_I, signal_type: AI, type: int, unit: "A", description: "预发酵进料电机电流（D2）"}
      - {name: M4_I, signal_type: AI, type: int, unit: "A", description: "预发酵出料电机电流（D3）"}
      - {name: M3_I, signal_type: AI, type: int, unit: "A", description: "预发酵主电机电流（D4）"}
      - {name: VFM2_I, signal_type: AI, type: int, unit: "A", description: "一级烘干进料电机电流（D5）"}
      - {name: M6_I, signal_type: AI, type: int, unit: "A", description: "一级烘干出料电机电流（D6）"}
      - {name: M5_I, signal_type: AI, type: int, unit: "A", description: "一级烘干主电机电流（D7）"}
      - {name: M7_I, signal_type: AI, type: int, unit: "A", description: "发酵进料电机电流（D8）"}
      - {name: M8_I, signal_type: AI, type: int, unit: "A", description: "发酵电机电流（D9）"}
      - {name: M9_I, signal_type: AI, type: int, unit: "A", description: "发酵出料电机电流（D10）"}
      - {name: VFM3_I, signal_type: AI, type: int, unit: "A", description: "二级烘干进料电机电流（D11）"}
      - {name: M11_I, signal_type: AI, type: int, unit: "A", description: "二级烘干出料电机电流（D12）"}
      - {name: M10_I, signal_type: AI, type: int, unit: "A", description: "二级烘干主电机电流（D13）"}
      - {name: M12_I, signal_type: AI, type: int, unit: "A", description: "滚筛进料电机电流（D14）"}
      - {name: M13_I, signal_type: AI, type: int, unit: "A", description: "滚筛出料电机电流（D15）"}
      - {name: M14_I, signal_type: AI, type: int, unit: "A", description: "最终出料电机电流（D16）"}
      - {name: VF1_I, signal_type: AI, type: int, unit: "A", description: "1级风机电机电流（D17）"}
      - {name: VF2_I, signal_type: AI, type: int, unit: "A", description: "2级风机电机电流（D18）"}
      - {name: VF3_I, signal_type: AI, type: int, unit: "A", description: "3级风机电机电流（D19）"}
      - {name: M15_I, signal_type: AI, type: int, unit: "A", description: "1级烘干上料电机电流（D20）"}
      - {name: M16_I, signal_type: AI, type: int, unit: "A", description: "2级烘干上料电机电流（D21）"}
    frequency:
      - {name: VFM1_FREQ, signal_type: AI, type: int, unit: "Hz", description: "预发酵进料电机运行频率（D30）"}
      - {name: VFM2_FREQ, signal_type: AI, type: int, unit: "Hz", description: "第一级烘干进料电机运行频率（D31）"}
      - {name: VFM3_FREQ, signal_type: AI, type: int, unit: "Hz", description: "第二级烘干进料电机运行频率（D32）"}
      - {name: VF1_FREQ, signal_type: AI, type: int, unit: "Hz", description: "1号风机运行频率（D33）"}
      - {name: VF2_FREQ, signal_type: AI, type: int, unit: "Hz", description: "2号风机运行频率（D34）"}
      - {name: VF3_FREQ, signal_type: AI, type: int, unit: "Hz", description: "3号风机运行频率（D35）"}
    temperature:
      - {name: FTT1_T, signal_type: AI, type: int, unit: "℃", description: "预烘干段蒸汽温度（1号排湿风机处）（D40）"}
      - {name: FTT2_T, signal_type: AI, type: int, unit: "℃", description: "一级烘干段蒸汽温度（2号排湿风机处）（D41）"}
      - {name: FTT3_T, signal_type: AI, type: int, unit: "℃", description: "二级烘干段蒸汽温度（3号排湿风机处）（D42）"}
      - {name: TT1_T, signal_type: AI, type: int, unit: "℃", description: "锅炉1炉口温度（D43）"}
      - {name: TT2_T, signal_type: AI, type: int, unit: "℃", description: "锅炉2炉口温度（D44）"}
    humidity:
      - {name: MT1_H, signal_type: AI, type: int32, unit: "%", description: "出料口实时湿度（D45）"}

mqtt:
  base_topic: "realtime"
  publish_interval: 1.0
  qos: 1
  retain: false

acquisition:
  scan_interval: 1.0
  batch_size: 100
  timeout: 5.0
