# PLC I/O tag skeleton. Canonical tag names come from docs/plc/io-map.html.
# Address, scale, and byte order are externalized to configs/modbus-address-map.yaml.
naming:
  format: "{IO_MAP_TAG}"
  allowed_pattern: "^[A-Z0-9_]+$"
  notes:
    - "Use io-map V2 tag names directly as the full-stack canonical IDs."
    - "I-M* names from io-map are normalized to I_M* for identifier safety."
    - "All 48 I/O points are read-only from edge; control soft points are separate."

