line_id: "L1"

system:
  interval: 30            # 秒
  disk_path: "/"
  publish_mqtt: true

services:
  interval: 20            # 秒
  http_timeout: 5         # 秒
  failure_threshold: 3    # 连续失败次数（默认）
  recovery_observe: 6     # 重启后观察周期
  max_restart_per_hour: 5 # 单服务每小时最大自愈次数
  self_heal:
    enabled: true         # 全局自愈开关
  targets:
    - name: "edge-api"
      url: "http://edge-api:8000/ready"
      container: "edge-api"
      self_heal:
        failure_threshold: 2
        max_restart_per_hour: 3
    - name: "edge-daq"
      url: "http://edge-daq:8080/ready"
      container: "edge-daq"
    - name: "ai-softsensor"
      url: "http://ai-softsensor:8080/health"
      container: "ai-softsensor"
    - name: "ai-ctrl-optimizer"
      url: "http://ai-ctrl-optimizer:8080/health"
      container: "ai-ctrl-optimizer"
    - name: "license-service"
      url: "http://license-service:8000/health"
      container: "license-service"
    - name: "edge-monitor"
      url: "http://edge-monitor:8080/health"
      container: "edge-monitor"
    - name: "edge-mosquitto"
      container: "edge-mosquitto"
      tcp:
        host: "edge-mosquitto"
        port: 1883
      self_heal:
        enabled: false
    - name: "edge-influxdb"
      url: "http://edge-influxdb:8086/health"
      container: "edge-influxdb"
      tcp:
        host: "edge-influxdb"
        port: 8086
    - name: "edge-postgres"
      container: "edge-postgres"
      tcp:
        host: "edge-postgres"
        port: 5432

