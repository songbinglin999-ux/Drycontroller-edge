line_id: "L1"

system:
  interval: 30            # 秒
  disk_path: "/"
  publish_mqtt: true

services:
  interval: 20            # 秒
  http_timeout: 5         # 秒
  failure_threshold: 3    # 连续失败次数（默认）
  recovery_observe: 6     # 重启后观察周期
  max_restart_per_hour: 5 # 单服务每小时最大自愈次数
  self_heal:
    # 监控容器只读；Docker mutation 仅属于 root-owned OTA helper 的固定状态机。
    enabled: false
  targets:
    - name: "edge-api"
      url: "http://edge-api:8000/ready"
      container: "edge-api"
      self_heal:
        failure_threshold: 2
        max_restart_per_hour: 3
    - name: "edge-daq"
      url: "http://edge-daq:8080/ready"
      container: "edge-daq"
    - name: "edge-monitor"
      url: "http://edge-monitor:8080/ready"
      container: "edge-monitor"
    - name: "edge-mosquitto"
      container: "edge-mosquitto"
      tcp:
        host: "edge-mosquitto"
        port: 1883
      self_heal:
        enabled: false
    - name: "edge-influxdb"
      url: "http://edge-influxdb:8086/health"
      container: "edge-influxdb"
      tcp:
        host: "edge-influxdb"
        port: 8086
    - name: "edge-postgres"
      container: "edge-postgres"
      tcp:
        host: "edge-postgres"
        port: 5432

control:
  status:
    enabled: true
    url: "http://edge-api:8000/api/v1/control/status"
    # /control/status 是只读白名单端点；monitor 仍可在 docker 内网附带 admin key，
    # 但大屏不需要也不能持有控制写 key。
    api_key_env: "ADMIN_API_KEYS"
    api_key_header: "X-API-Key"
    self_heal:
      enabled: false
