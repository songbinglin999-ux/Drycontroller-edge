line_id: "L1"

system:
  interval: 30            # 秒
  disk_path: "/"
  publish_mqtt: true

services:
  interval: 20            # 秒
  http_timeout: 5         # 秒
  failure_threshold: 3    # 连续失败次数（默认）
  recovery_observe: 6     # 重启后观察周期
  max_restart_per_hour: 5 # 单服务每小时最大自愈次数
  self_heal:
    enabled: true         # 全局自愈开关
  targets:
    - name: "edge-api"
      url: "http://edge-api:8000/ready"
      container: "edge-api"
      self_heal:
        failure_threshold: 2
        max_restart_per_hour: 3
    - name: "edge-daq"
      url: "http://edge-daq:8080/ready"
      container: "edge-daq"
    - name: "ai-softsensor"
      url: "http://ai-softsensor:8080/ready"
      container: "ai-softsensor"
      # /ready 表示模型、MQTT 和数据质量都可信；缺模型或无 PLC 数据时允许 degraded，不做自动重启。
      self_heal:
        enabled: false
    - name: "ai-ctrl-optimizer"
      url: "http://ai-ctrl-optimizer:8080/ready"
      container: "ai-ctrl-optimizer"
    - name: "license-service"
      url: "http://license-service:8000/ready"
      container: "license-service"
    - name: "edge-monitor"
      url: "http://edge-monitor:8080/ready"
      container: "edge-monitor"
    - name: "edge-mosquitto"
      container: "edge-mosquitto"
      tcp:
        host: "edge-mosquitto"
        port: 1883
      self_heal:
        enabled: false
    - name: "edge-influxdb"
      url: "http://edge-influxdb:8086/health"
      container: "edge-influxdb"
      tcp:
        host: "edge-influxdb"
        port: 8086
    - name: "edge-postgres"
      container: "edge-postgres"
      tcp:
        host: "edge-postgres"
        port: 5432

control:
  status:
    enabled: true
    url: "http://edge-api:8000/api/v1/control/status"
    # edge-api /control/status 当前走控制级鉴权；monitor 在 docker 内网用 admin key 只读拉取，
    # 不把控制写 key 暴露到只读外部面。
    api_key_env: "ADMIN_API_KEYS"
    api_key_header: "X-API-Key"
    self_heal:
      enabled: false
