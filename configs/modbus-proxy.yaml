# Address-preserving Modbus TCP proxy for a dedicated vendor HMI (example).
#
# SAFE DEFAULT: writes are disabled. Reads are forwarded only when
# HMI_PROXY_ENABLED=true is set on both edge-api and edge-daq.
# See docs/plc/hmi-modbus-proxy.md and SECURITY.md before enabling writes.
#
# Address values are raw Modbus PDU addresses (example map: D0 -> 40000).
listen_host: 0.0.0.0  # Container only; publish to one explicit field interface.
listen_port: 2000
allowed_client_ips: [192.0.2.100]  # example HMI address (documentation range)
max_clients: 2
response_timeout_sec: 2.0
client_idle_timeout_sec: 30.0
write_enabled: false
# Must be set to true only after the field network is isolated/firewalled.
source_network_verified: false
write_journal: /data/edge-daq/hmi-proxy-write.json
write_rules: []
# Example of a narrow, signed-off range (inactive while write_enabled is false).
write_ranges:
  - area: holding
    start_address: 43000
    end_address: 43003
    min: 0
    max: 500
    repeat_safe: true
    evidence: example-signoff-replace-me
