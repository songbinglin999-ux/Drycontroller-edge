name: edge-tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: edge-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements-test.txt"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libarchive-tools

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Lint (ruff)
        run: ruff check services/ common/ scripts/ --per-file-ignores "**/tests/**:E402" --output-format=github

      - name: Run tests
        run: |
          set -euo pipefail
          python -m pytest -q services common tests infra scripts

      - name: Code review gates
        run: bash scripts/ci-code-review-gates.sh
