[pytest]
# 防止 pytest 递归进入虚拟环境目录，避免收集第三方包里的测试文件
norecursedirs =
    .venv
    venv
    env
    ENV
    .eggs
    dist
    build
    node_modules
    __pycache__
    .git
    .tox
    htmlcov

# 指定测试发现路径：services/ + common/ + 顶层 tests/（P2-14 的 test_http_utils 在此）
testpaths =
    services
    common
    tests

# asyncio 模式（与 pytest-asyncio 配合）
asyncio_mode = auto
