version: '3.8'

services:
  # ==================== 数据库服务 ====================
  postgres:
    image: postgres:15-alpine
    container_name: edge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - edge-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== 时序数据库 ====================
  influxdb:
    image: influxdb:2.7-alpine
    container_name: edge-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    ports:
      - "8086:8086"
    networks:
      - edge-network
    restart: always
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== MQTT Broker ====================
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: edge-mosquitto
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./infra/mosquitto/passwords:/mosquitto/config/passwords
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    ports:
      - "1883:1883"
      - "9001:9001"
    networks:
      - edge-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -u ${MQTT_USER} -P ${MQTT_PASSWORD} -t '$$SYS/#' -C 1 | grep -v Error || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== 边缘 API 服务 ====================
  edge-api:
    build:
      context: .
      dockerfile: services/edge-api/Dockerfile
    container_name: edge-api
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - INFLUXDB_HOST=${INFLUXDB_HOST}
      - INFLUXDB_PORT=${INFLUXDB_PORT}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      # 控制闭环：签名密钥（必须与 edge-daq 的 CONTROL_SIGNATURE_SECRET 一致）
      - CONTROL_SIGNATURE_SECRET=${CONTROL_SIGNATURE_SECRET}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - ./logs/edge-api:/logs/edge-api
      - ./configs:/app/configs:ro
    ports:
      - "${EDGE_API_PORT}:8000"
    networks:
      - edge-network
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: always

  # ==================== 数据采集服务 ====================
  edge-daq:
    build:
      context: .
      dockerfile: services/edge-daq/Dockerfile
    container_name: edge-daq
    environment:
      - PLC_HOST=${PLC_HOST}
      - PLC_PORT=${PLC_PORT}
      - PLC_SLAVE_ID=${PLC_SLAVE_ID}
      - PLC_SCAN_INTERVAL=${PLC_SCAN_INTERVAL}
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      # 开发/演示环境：当前 mosquitto 为 1883 明文；edge-daq 默认强制 TLS，因此需显式允许不安全连接
      # 生产环境请改为 MQTT_TLS=true 并配置 broker TLS/ACL
      - MQTT_ALLOW_INSECURE=true
      # 控制闭环：验签密钥（必须与 edge-api 一致）
      - CONTROL_SIGNATURE_SECRET=${CONTROL_SIGNATURE_SECRET}
      - INFLUXDB_HOST=${INFLUXDB_HOST}
      - INFLUXDB_PORT=${INFLUXDB_PORT}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - LOG_LEVEL=${LOG_LEVEL}
      - HEALTH_PORT=8080
    volumes:
      - ./logs/edge-daq:/logs/edge-daq
      - ./configs:/app/configs:ro
    networks:
      - edge-network
    depends_on:
      - mosquitto
      - influxdb
    restart: always

  # ==================== AI 软测量服务 ====================
  ai-softsensor:
    build:
      context: .
      dockerfile: services/ai-softsensor/Dockerfile
    container_name: ai-softsensor
    environment:
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - INFLUXDB_HOST=${INFLUXDB_HOST}
      - INFLUXDB_PORT=${INFLUXDB_PORT}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - AI_MODEL_PATH=${AI_MODEL_PATH}
      - LOG_LEVEL=${LOG_LEVEL}
      - HEALTH_PORT=8080
    volumes:
      - ./logs/ai-softsensor:/logs/ai-softsensor
      - ./configs:/app/configs:ro
      - ./services/ai-softsensor/models:/app/models
    networks:
      - edge-network
    depends_on:
      - mosquitto
      - influxdb
    restart: always

  # ==================== AI 控制优化服务 ====================
  ai-ctrl-optimizer:
    build:
      context: .
      dockerfile: services/ai-ctrl-optimizer/Dockerfile
    container_name: ai-ctrl-optimizer
    environment:
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - INFLUXDB_HOST=${INFLUXDB_HOST}
      - INFLUXDB_PORT=${INFLUXDB_PORT}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - AI_MODEL_PATH=${AI_MODEL_PATH}
      - LOG_LEVEL=${LOG_LEVEL}
      - HEALTH_PORT=8080
    volumes:
      - ./logs/ai-ctrl-optimizer:/logs/ai-ctrl-optimizer
      - ./configs:/app/configs:ro
      - ./services/ai-ctrl-optimizer/models:/app/models
    networks:
      - edge-network
    depends_on:
      - mosquitto
      - influxdb
      - ai-softsensor
    restart: always

  # ==================== 授权服务 ====================
  license-service:
    build:
      context: .
      dockerfile: services/license-service/Dockerfile
    container_name: license-service
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - LICENSE_CHECK_ENABLED=${LICENSE_CHECK_ENABLED}
      - LICENSE_EXPIRY_DAYS=${LICENSE_EXPIRY_DAYS}
      - INFLUXDB_HOST=${INFLUXDB_HOST}
      - INFLUXDB_PORT=${INFLUXDB_PORT}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - ./logs/license-service:/logs/license-service
      - /dev/bus/usb:/dev/bus/usb  # USB 设备映射（加密狗）
    ports:
      - "${LICENSE_SERVICE_PORT}:8000"
    networks:
      - edge-network
    depends_on:
      - postgres
    privileged: true  # 需要访问 USB 设备
    restart: always

  # ==================== 系统监控服务 ====================
  edge-monitor:
    build:
      context: .
      dockerfile: services/edge-monitor/Dockerfile
    container_name: edge-monitor
    environment:
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - INFLUXDB_HOST=${INFLUXDB_HOST}
      - INFLUXDB_PORT=${INFLUXDB_PORT}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - ./logs/edge-monitor:/logs/edge-monitor
      - ./logs:/logs:ro
      - ./configs:/app/configs:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infra/discovery:/app/bootstrap
    networks:
      - edge-network
    ports:
      - "${EDGE_MONITOR_PORT:-8080}:8080"
    depends_on:
      - mosquitto
      - influxdb
    restart: always

networks:
  edge-network:
    driver: bridge

volumes:
  postgres_data:
  influxdb_data:
  influxdb_config:
  mosquitto_data:
  mosquitto_logs:

