x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

x-ulimits: &default-ulimits
  nofile:
    soft: 65536
    hard: 65536

services:
  # ==================== 数据库服务 ====================
  postgres:
    image: postgres:15-alpine
    container_name: edge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - edge-network
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== 时序数据库 ====================
  influxdb:
    image: influxdb:2.7-alpine
    container_name: edge-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    ports:
      - "127.0.0.1:8086:8086"
    networks:
      - edge-network
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== MQTT Broker ====================
  # secrets 初始化（生成 /mosquitto/secret/passwords；证书由现场挂载到 /mosquitto/secret/certs）
  mosquitto-init:
    image: eclipse-mosquitto:2.0
    container_name: edge-mosquitto-init
    networks:
      - edge-network
    volumes:
      - mosquitto_secrets:/mosquitto/secret
    environment:
      - MQTT_USER_EDGE_API=${MQTT_USER_EDGE_API}
      - MQTT_PASSWORD_EDGE_API=${MQTT_PASSWORD_EDGE_API}
      - MQTT_USER_EDGE_DAQ=${MQTT_USER_EDGE_DAQ}
      - MQTT_PASSWORD_EDGE_DAQ=${MQTT_PASSWORD_EDGE_DAQ}
      - MQTT_USER_AI_SOFTSENSOR=${MQTT_USER_AI_SOFTSENSOR}
      - MQTT_PASSWORD_AI_SOFTSENSOR=${MQTT_PASSWORD_AI_SOFTSENSOR}
      - MQTT_USER_EDGE_MONITOR=${MQTT_USER_EDGE_MONITOR}
      - MQTT_PASSWORD_EDGE_MONITOR=${MQTT_PASSWORD_EDGE_MONITOR}
      - MQTT_INIT_FORCE=${MQTT_INIT_FORCE:-false}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        PASSFILE="/mosquitto/secret/passwords"
        mkdir -p "/mosquitto/secret"
        if [ -f "$${PASSFILE}" ] && [ "$${MQTT_INIT_FORCE:-false}" != "true" ]; then
          echo "[mosquitto-init] passwords exists, skip (set MQTT_INIT_FORCE=true to regenerate)"
          exit 0
        fi
        : "$${MQTT_USER_EDGE_API:?missing MQTT_USER_EDGE_API}"
        : "$${MQTT_PASSWORD_EDGE_API:?missing MQTT_PASSWORD_EDGE_API}"
        : "$${MQTT_USER_EDGE_DAQ:?missing MQTT_USER_EDGE_DAQ}"
        : "$${MQTT_PASSWORD_EDGE_DAQ:?missing MQTT_PASSWORD_EDGE_DAQ}"
        : "$${MQTT_USER_AI_SOFTSENSOR:?missing MQTT_USER_AI_SOFTSENSOR}"
        : "$${MQTT_PASSWORD_AI_SOFTSENSOR:?missing MQTT_PASSWORD_AI_SOFTSENSOR}"
        : "$${MQTT_USER_EDGE_MONITOR:?missing MQTT_USER_EDGE_MONITOR}"
        : "$${MQTT_PASSWORD_EDGE_MONITOR:?missing MQTT_PASSWORD_EDGE_MONITOR}"
        rm -f "$${PASSFILE}"
        mosquitto_passwd -b -c "$${PASSFILE}" "$${MQTT_USER_EDGE_API}" "$${MQTT_PASSWORD_EDGE_API}"
        mosquitto_passwd -b "$${PASSFILE}" "$${MQTT_USER_EDGE_DAQ}" "$${MQTT_PASSWORD_EDGE_DAQ}"
        mosquitto_passwd -b "$${PASSFILE}" "$${MQTT_USER_AI_SOFTSENSOR}" "$${MQTT_PASSWORD_AI_SOFTSENSOR}"
        mosquitto_passwd -b "$${PASSFILE}" "$${MQTT_USER_EDGE_MONITOR}" "$${MQTT_PASSWORD_EDGE_MONITOR}"
        # mosquitto 官方镜像默认以 uid=1883 运行；若 passwords 属主为 root 会导致 broker 启动失败
        chown 1883:1883 "$${PASSFILE}" || true
        chmod 600 "$${PASSFILE}"
        mkdir -p "/mosquitto/secret/certs"
        echo "[mosquitto-init] passwords generated: $${PASSFILE}"
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: edge-mosquitto
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/mosquitto.tls.conf:/mosquitto/config/mosquitto.tls.conf:ro
      - ./infra/mosquitto/acl:/mosquitto/config/acl:ro
      - ./infra/mosquitto/entrypoint.sh:/entrypoint.sh:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
      - mosquitto_secrets:/mosquitto/secret
    environment:
      # 生产建议：MQTT_TLS=true（会切换到 8883/9002 监听）
      - MQTT_TLS=${MQTT_TLS:-false}
      # healthcheck 使用的账号（默认用 edge-api 账号）
      - MQTT_HEALTH_USER=${MQTT_USER_EDGE_API}
      - MQTT_HEALTH_PASSWORD=${MQTT_PASSWORD_EDGE_API}
    ports:
      # 安全基线：默认仅绑定本机回环地址（外部如需访问请显式修改）
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:9001:9001"
      - "127.0.0.1:8883:8883"
      - "127.0.0.1:9002:9002"
    networks:
      - edge-network
    restart: always
    logging: *default-logging
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ \"$${MQTT_TLS:-false}\" = \"true\" ] || [ \"$${MQTT_TLS:-false}\" = \"1\" ] || [ \"$${MQTT_TLS:-false}\" = \"yes\" ]; then mosquitto_sub -h localhost -p 8883 --cafile /mosquitto/secret/certs/ca.crt -u \"$${MQTT_HEALTH_USER}\" -P \"$${MQTT_HEALTH_PASSWORD}\" -t '$$SYS/broker/uptime' -C 1 -W 12 >/dev/null 2>&1; else mosquitto_sub -h localhost -p 1883 -u \"$${MQTT_HEALTH_USER}\" -P \"$${MQTT_HEALTH_PASSWORD}\" -t '$$SYS/broker/uptime' -C 1 -W 12 >/dev/null 2>&1; fi || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== 边缘 API 服务 ====================
  edge-api:
    build:
      context: .
      dockerfile: services/edge-api/Dockerfile
    container_name: edge-api
    ulimits: *default-ulimits
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - INFLUXDB_HOST=${INFLUXDB_HOST}
      - INFLUXDB_PORT=${INFLUXDB_PORT}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USER=${MQTT_USER_EDGE_API}
      - MQTT_PASSWORD=${MQTT_PASSWORD_EDGE_API}
      # 控制闭环：签名密钥（必须与 edge-daq 的 CONTROL_SIGNATURE_SECRET 一致）
      - CONTROL_SIGNATURE_SECRET=${CONTROL_SIGNATURE_SECRET}
      # 7x24 安全基线：API Key（控制/运维接口）
      - API_KEY_HEADER=${API_KEY_HEADER:-X-API-Key}
      - CONTROL_API_KEYS=${CONTROL_API_KEYS}
      - ADMIN_API_KEYS=${ADMIN_API_KEYS}
      # License 只读闭环：成对激活只由宿主 root 事务管理器执行
      - LICENSE_FILE_PATH=${LICENSE_FILE_PATH:-/etc/drycontroller/license/license.json}
      - LICENSE_TRUST_POLICY_PATH=${LICENSE_TRUST_POLICY_PATH:-/etc/drycontroller/keys/license-trust/policy.json}
      - LICENSE_SERVICE_BASE=${LICENSE_SERVICE_BASE:-http://license-service:8000}
      # Registry pull credential lifecycle: Cloud Ops refresh writes Docker auth + status here.
      - REGISTRY_DOCKER_CONFIG_PATH=${REGISTRY_DOCKER_CONFIG_PATH:-/etc/drycontroller/registry/config.json}
      - REGISTRY_CREDENTIAL_STATUS_PATH=${REGISTRY_CREDENTIAL_STATUS_PATH:-/etc/drycontroller/registry/status.json}
      - REGISTRY_CREDENTIAL_MAX_AGE_HOURS=${REGISTRY_CREDENTIAL_MAX_AGE_HOURS:-0}
      # 大屏现场状态摘要只读展示云端/tailnet 配置状态
      - CLOUD_OPS_BASE_URL=${CLOUD_OPS_BASE_URL:-}
      - DEVICE_IDENTITY_PATH=${DEVICE_IDENTITY_PATH:-/var/lib/drycontroller/device.json}
      - CLOUD_IDENTITY_PUBLIC_KEY_FILE=${CLOUD_IDENTITY_PUBLIC_KEY_FILE:-/etc/drycontroller/trust/device-identity-cloud.pub}
      - CLOUD_REQUEST_NONCE_DB=/var/lib/drycontroller-cloud-request-nonces/nonces.sqlite3
      - TS_LOGIN_SERVER=${TS_LOGIN_SERVER:-}
      - TAILSCALE_EXPECTED_VERSION=${TAILSCALE_EXPECTED_VERSION:-}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - /var/log/drycontroller/edge-api:/logs/edge-api
      - ./configs:/app/configs:ro
      # 运行时可变配置（由云端下发）：例如 PLC 通讯参数（不改网卡，只改应用层）
      - /var/lib/drycontroller/configs-runtime:/app/configs-runtime
      # edge-api 不拥有 license 或 trust policy 的写入面。
      - /etc/drycontroller/license:/etc/drycontroller/license:ro
      - /etc/drycontroller/keys:/etc/drycontroller/keys:ro
      - /etc/drycontroller/registry:/etc/drycontroller/registry
      # 只读读取 bootstrap sentinel，供大屏现场状态摘要显示装机状态
      - /var/lib/drycontroller:/var/lib/drycontroller:ro
      - /var/lib/drycontroller/cloud-request-nonces:/var/lib/drycontroller-cloud-request-nonces
      - /etc/drycontroller/trust:/etc/drycontroller/trust:ro
      # 唯一宿主 mutation 边界：只连接 root-owned 0660 UDS，不挂 Docker socket。
      - /run/drycontroller-ota:/run/drycontroller-ota:ro
      - /run/drycontroller-host-release:/run/drycontroller-host-release:ro
    ports:
      # P0-N1 audit 2026-05-15：默认绑 127.0.0.1，避免 LAN/PLC 网段直达 license install
      # 端点。生产若真有外部访问需求，由前置 Caddy/Traefik 反代，并显式覆写本变量。
      - "127.0.0.1:${EDGE_API_LOCAL_PORT:-18080}:8000"
    networks:
      - edge-network
    # P1-N12 audit 2026-05-20：staging 用 SSH 反向隧道把 cloud-ops 暴露在 host 127.0.0.1:18088
    # 时，bridge 网络内的容器 127.0.0.1 不是 host loopback，CloudSyncOutboxDrainer 直连会
    # ConnectionRefusedError。声明 host-gateway 后可用 CLOUD_OPS_BASE_URL=http://host.docker.internal:18088
    # 走 host loopback。生产用 tailnet IP/DNS（CLOUD_OPS_BASE_URL 由 bootstrap 写入），不依赖此项。
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # Keep the public TLS server name/SNI while forcing the Cloud path through
      # the pinned Headscale CGNAT address from OS Installer public config.
      - "${CLOUD_OPS_TLS_SERVER_NAME:?missing Cloud TLS server name}:${CLOUD_OPS_TAILNET_ADDRESS:?missing Cloud Tailnet address}"
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: always
    logging: *default-logging

  # ==================== 数据采集服务 ====================
  edge-daq:
    build:
      context: .
      dockerfile: services/edge-daq/Dockerfile
    container_name: edge-daq
    ulimits: *default-ulimits
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - PLC_HOST=${PLC_HOST}
      - PLC_PORT=${PLC_PORT:-2022}
      - PLC_SLAVE_ID=${PLC_SLAVE_ID}
      - PLC_SCAN_INTERVAL=${PLC_SCAN_INTERVAL}
      - MODBUS_FRAMER=${MODBUS_FRAMER:-rtu}
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USER=${MQTT_USER_EDGE_DAQ}
      - MQTT_PASSWORD=${MQTT_PASSWORD_EDGE_DAQ}
      # 开发/演示环境：当前 mosquitto 为 1883 明文；edge-daq 默认强制 TLS，因此需显式允许不安全连接
      # 生产环境请改为 MQTT_TLS=true 并配置 broker TLS/ACL
      - MQTT_ALLOW_INSECURE=true
      # 控制闭环：验签密钥（必须与 edge-api 一致）
      - CONTROL_SIGNATURE_SECRET=${CONTROL_SIGNATURE_SECRET}
      - INFLUXDB_HOST=${INFLUXDB_HOST}
      - INFLUXDB_PORT=${INFLUXDB_PORT}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - LOG_LEVEL=${LOG_LEVEL}
      - HEALTH_PORT=8080
    volumes:
      - /var/log/drycontroller/edge-daq:/logs/edge-daq
      - ./configs:/app/configs:ro
      # 运行时可变配置（只读）：例如 PLC 通讯参数（由 edge-api 落盘后重启生效）
      - /var/lib/drycontroller/configs-runtime:/app/configs-runtime:ro
    ports:
      # 仅用于本机健康探针与 OTA 校验（脚本默认通过 localhost 校验）
      # 注意：edge-monitor 默认占用 8080，因此这里默认用 8082
      - "127.0.0.1:${EDGE_DAQ_HEALTH_PORT:-8082}:8080"
    networks:
      - edge-network
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    restart: always
    logging: *default-logging

  # ==================== AI 软测量服务 ====================
  ai-softsensor:
    # 只读软测量默认启动；模型或数据未就绪时 /ready 可降级，但容器本身不应因缺 PLC 数据重启。
    build:
      context: .
      dockerfile: services/ai-softsensor/Dockerfile
    container_name: ai-softsensor
    ulimits: *default-ulimits
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USER=${MQTT_USER_AI_SOFTSENSOR}
      - MQTT_PASSWORD=${MQTT_PASSWORD_AI_SOFTSENSOR}
      - INFLUXDB_HOST=${INFLUXDB_HOST}
      - INFLUXDB_PORT=${INFLUXDB_PORT}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - AI_MODEL_PATH=${AI_MODEL_PATH}
      - LOG_LEVEL=${LOG_LEVEL}
      - HEALTH_PORT=8080
    volumes:
      - /var/log/drycontroller/ai-softsensor:/logs/ai-softsensor
      - ./configs:/app/configs:ro
      - /var/lib/drycontroller/models/ai-softsensor:/app/models:ro
    networks:
      - edge-network
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    restart: always
    logging: *default-logging

  # ==================== AI 控制优化服务 ====================
  ai-ctrl-optimizer:
    # 默认启动；当前只作为优化/suggestion 服务骨架，不直写 PLC。
    build:
      context: .
      dockerfile: services/ai-ctrl-optimizer/Dockerfile
    container_name: ai-ctrl-optimizer
    ulimits: *default-ulimits
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USER=${MQTT_USER_AI_CTRL_OPTIMIZER:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD_AI_CTRL_OPTIMIZER:-}
      - INFLUXDB_HOST=${INFLUXDB_HOST}
      - INFLUXDB_PORT=${INFLUXDB_PORT}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - AI_MODEL_PATH=${AI_MODEL_PATH}
      - LOG_LEVEL=${LOG_LEVEL}
      - HEALTH_PORT=8080
    volumes:
      - /var/log/drycontroller/ai-ctrl-optimizer:/logs/ai-ctrl-optimizer
      - ./configs:/app/configs:ro
      - /var/lib/drycontroller/models/ai-ctrl-optimizer:/app/models:ro
    networks:
      - edge-network
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      ai-softsensor:
        condition: service_started
    restart: always
    logging: *default-logging

  # ==================== 授权服务 ====================
  license-service:
    build:
      context: .
      dockerfile: services/license-service/Dockerfile
    container_name: license-service
    ulimits: *default-ulimits
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - LICENSE_CHECK_ENABLED=${LICENSE_CHECK_ENABLED}
      - LICENSE_EXPIRY_DAYS=${LICENSE_EXPIRY_DAYS}
      - LICENSE_FILE_PATH=${LICENSE_FILE_PATH:-/etc/drycontroller/license/license.json}
      - LICENSE_TRUST_POLICY_PATH=${LICENSE_TRUST_POLICY_PATH:-/etc/drycontroller/keys/license-trust/policy.json}
      - LICENSE_MACHINE_ID=${LICENSE_MACHINE_ID:-}
      - INFLUXDB_HOST=${INFLUXDB_HOST}
      - INFLUXDB_PORT=${INFLUXDB_PORT}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - /var/log/drycontroller/license-service:/logs/license-service
      - /etc/drycontroller/license:/etc/drycontroller/license:ro
      - /etc/drycontroller/keys:/etc/drycontroller/keys:ro
    ports:
      # P0-N1 audit 2026-05-15：跟 edge-api 同样默认绑 127.0.0.1
      - "${LICENSE_SERVICE_BIND_ADDR:-127.0.0.1}:${LICENSE_SERVICE_PORT}:8000"
    networks:
      - edge-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    logging: *default-logging

  # ==================== 系统监控服务 ====================
  edge-monitor:
    build:
      context: .
      dockerfile: services/edge-monitor/Dockerfile
    container_name: edge-monitor
    ulimits: *default-ulimits
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USER=${MQTT_USER_EDGE_MONITOR}
      - MQTT_PASSWORD=${MQTT_PASSWORD_EDGE_MONITOR}
      - INFLUXDB_HOST=${INFLUXDB_HOST}
      - INFLUXDB_PORT=${INFLUXDB_PORT}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - LOG_LEVEL=${LOG_LEVEL}
      # 工业级告警：对接本地 Alertmanager（Prometheus 触发告警后可被 ops-console 展示）
      - ALERTMANAGER_BASE_URL=http://alertmanager:9093
      # 7x24 安全基线：保护 /ops/* 高危接口（默认复用 ADMIN_API_KEYS，也可单独配置 MONITOR_OPS_API_KEYS）
      - MONITOR_API_KEY_HEADER=${API_KEY_HEADER:-X-API-Key}
      - MONITOR_OPS_API_KEYS=${MONITOR_OPS_API_KEYS}
      - ADMIN_API_KEYS=${ADMIN_API_KEYS}
    volumes:
      - /var/log/drycontroller/edge-monitor:/logs/edge-monitor
      - /var/log/drycontroller:/logs:ro
      - ./configs:/app/configs:ro
      - /var/lib/drycontroller/discovery:/app/bootstrap
    networks:
      - edge-network
    ports:
      # 7x24 默认安全：仅绑定本机回环地址，避免运维面暴露到现场网段
      - "127.0.0.1:${EDGE_MONITOR_PORT:-8080}:8080"
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    restart: always
    logging: *default-logging

  # ==================== Prometheus（指标采集/告警规则） ====================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: edge-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - edge-network
    depends_on:
      - edge-api
      - edge-daq
      - ai-softsensor
      - alertmanager
    restart: always
    logging: *default-logging

  # ==================== Alertmanager（告警聚合/查询） ====================
  alertmanager:
    image: prom/alertmanager:v0.33.1@sha256:a89f8d4520954079275441eecdb71444328bd90633dd4eddfc33b9ed657f349b
    container_name: edge-alertmanager
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - edge-network
    restart: always
    logging: *default-logging

networks:
  edge-network:
    driver: bridge

volumes:
  postgres_data:
  influxdb_data:
  influxdb_config:
  mosquitto_data:
  mosquitto_logs:
  mosquitto_secrets:
  prometheus_data:
  alertmanager_data:
