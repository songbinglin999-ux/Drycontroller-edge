version: '3.8'

services:
  # ==================== 远程运维通道（Tailscale） ====================
  # 使用方式：
  # - 仅在需要“云端无公网入站 → 远程运维边缘机”时启用
  # - 启动：docker compose --profile remote-debug up -d tailscale
  # 前提：
  # - 云端已部署 Headscale（自建控制面）并生成 preauth key
  # - TS_LOGIN_SERVER/TS_AUTHKEY 配置正确
  #
  # 重要说明：
  # - 该服务需要 Linux（/dev/net/tun + network_mode=host）
  # - 共享宿主机网络命名空间后，云端可通过 tailnet IP 直接访问宿主机映射端口（例如 edge-api 的 8000）
  tailscale:
    image: tailscale/tailscale:stable
    container_name: edge-tailscale
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - tailscale_state:/var/lib/tailscale
      - tailscale_run:/var/run/tailscale
    environment:
      # Headscale/Tailscale 登录信息（敏感）
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_LOGIN_SERVER=${TS_LOGIN_SERVER}
      # 可选：hostname / 额外参数
      - TS_HOSTNAME=${TS_HOSTNAME:-edge-node}
      - TS_EXTRA_ARGS=--login-server=${TS_LOGIN_SERVER} --hostname=${TS_HOSTNAME:-edge-node} --accept-dns=true
      # 状态存储目录
      - TS_STATE_DIR=/var/lib/tailscale
    restart: unless-stopped
    profiles:
      - remote-debug

  # ==================== 节点自注册/心跳（Enroll → cloud-ops） ====================
  # 作用：边缘机上线后，自动向云端 cloud-ops 报到/心跳，从而在 nodes 列表中自动可见。
  # 说明：
  # - 该容器通过 tailscaled socket 获取 tailnet IP（100.x.x.x），并 POST 到 cloud-ops /api/v1/enroll
  # - 仅在 remote-debug 场景启用（与 tailscale 一起）
  edge-enroll:
    image: tailscale/tailscale:stable
    container_name: edge-enroll
    network_mode: "host"
    depends_on:
      - tailscale
    volumes:
      - tailscale_state:/var/lib/tailscale:ro
      - tailscale_run:/var/run/tailscale
    environment:
      # cloud-ops 地址（示例：https://cloud-ops.example.com 或 http://<ip>:8088）
      - CLOUD_OPS_BASE_URL=${CLOUD_OPS_BASE_URL}
      # enroll token（对应云端 cloud-ops 的 ENROLL_TOKEN）
      - CLOUD_OPS_ENROLL_TOKEN=${CLOUD_OPS_ENROLL_TOKEN}
      # 可选：header 名（默认 X-Enroll-Token）
      - CLOUD_OPS_ENROLL_TOKEN_HEADER=${CLOUD_OPS_ENROLL_TOKEN_HEADER:-X-Enroll-Token}
      # 节点名称：建议与 TS_HOSTNAME 一致
      - ENROLL_NAME=${TS_HOSTNAME:-edge-node}
      # 边缘 edge-api 对外端口（宿主机映射端口）
      - ENROLL_EDGE_API_PORT=${EDGE_API_PORT:-8000}
      # 心跳周期（秒）
      - ENROLL_INTERVAL_SEC=${ENROLL_INTERVAL_SEC:-60}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      set -eu;
      if [ -z "${CLOUD_OPS_BASE_URL:-}" ] || [ -z "${CLOUD_OPS_ENROLL_TOKEN:-}" ]; then
        echo "[edge-enroll] missing CLOUD_OPS_BASE_URL or CLOUD_OPS_ENROLL_TOKEN; exiting";
        exit 1;
      fi;
      SOCKET="/var/run/tailscale/tailscaled.sock";
      echo "[edge-enroll] waiting for tailscaled socket: $SOCKET";
      i=0;
      while [ ! -S "$SOCKET" ]; do i=$((i+1)); if [ $i -gt 60 ]; then echo "[edge-enroll] tailscaled socket not ready"; exit 2; fi; sleep 1; done;
      echo "[edge-enroll] starting enroll loop";
      while true; do
        IP="$(tailscale --socket=$SOCKET ip -4 2>/dev/null | head -n 1 || true)";
        if [ -z "$IP" ]; then
          echo "[edge-enroll] no tailnet ipv4 yet; retry";
          sleep 3;
          continue;
        fi;
        URL="${CLOUD_OPS_BASE_URL%/}/api/v1/enroll";
        echo "[edge-enroll] enrolling name=${ENROLL_NAME} address=${IP} port=${ENROLL_EDGE_API_PORT} -> ${URL}";
        curl -fsS -X POST "$URL" \
          -H "Content-Type: application/json" \
          -H "${CLOUD_OPS_ENROLL_TOKEN_HEADER}: ${CLOUD_OPS_ENROLL_TOKEN}" \
          -d "{\"name\":\"${ENROLL_NAME}\",\"address\":\"${IP}\",\"edge_api_port\":${ENROLL_EDGE_API_PORT}}" \
          || echo "[edge-enroll] enroll request failed (will retry)";
        sleep "${ENROLL_INTERVAL_SEC}";
      done
    restart: unless-stopped
    profiles:
      - remote-debug

  # ==================== 数据库服务 ====================
  postgres:
    image: postgres:15-alpine
    container_name: edge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - edge-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== 时序数据库 ====================
  influxdb:
    image: influxdb:2.7-alpine
    container_name: edge-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    ports:
      - "8086:8086"
    networks:
      - edge-network
    restart: always
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== MQTT Broker ====================
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: edge-mosquitto
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./infra/mosquitto/passwords:/mosquitto/config/passwords
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    ports:
      - "1883:1883"
      - "9001:9001"
    networks:
      - edge-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -u ${MQTT_USER} -P ${MQTT_PASSWORD} -t '$$SYS/#' -C 1 | grep -v Error || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== 边缘 API 服务 ====================
  edge-api:
    build:
      context: .
      dockerfile: services/edge-api/Dockerfile
    container_name: edge-api
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - INFLUXDB_HOST=${INFLUXDB_HOST}
      - INFLUXDB_PORT=${INFLUXDB_PORT}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      # 控制闭环：签名密钥（必须与 edge-daq 的 CONTROL_SIGNATURE_SECRET 一致）
      - CONTROL_SIGNATURE_SECRET=${CONTROL_SIGNATURE_SECRET}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - ./logs/edge-api:/logs/edge-api
      - ./configs:/app/configs:ro
    ports:
      - "${EDGE_API_PORT}:8000"
    networks:
      - edge-network
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: always

  # ==================== 数据采集服务 ====================
  edge-daq:
    build:
      context: .
      dockerfile: services/edge-daq/Dockerfile
    container_name: edge-daq
    environment:
      - PLC_HOST=${PLC_HOST}
      - PLC_PORT=${PLC_PORT}
      - PLC_SLAVE_ID=${PLC_SLAVE_ID}
      - PLC_SCAN_INTERVAL=${PLC_SCAN_INTERVAL}
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      # 开发/演示环境：当前 mosquitto 为 1883 明文；edge-daq 默认强制 TLS，因此需显式允许不安全连接
      # 生产环境请改为 MQTT_TLS=true 并配置 broker TLS/ACL
      - MQTT_ALLOW_INSECURE=true
      # 控制闭环：验签密钥（必须与 edge-api 一致）
      - CONTROL_SIGNATURE_SECRET=${CONTROL_SIGNATURE_SECRET}
      - INFLUXDB_HOST=${INFLUXDB_HOST}
      - INFLUXDB_PORT=${INFLUXDB_PORT}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - LOG_LEVEL=${LOG_LEVEL}
      - HEALTH_PORT=8080
    volumes:
      - ./logs/edge-daq:/logs/edge-daq
      - ./configs:/app/configs:ro
    networks:
      - edge-network
    depends_on:
      - mosquitto
      - influxdb
    restart: always

  # ==================== AI 软测量服务 ====================
  ai-softsensor:
    build:
      context: .
      dockerfile: services/ai-softsensor/Dockerfile
    container_name: ai-softsensor
    environment:
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - INFLUXDB_HOST=${INFLUXDB_HOST}
      - INFLUXDB_PORT=${INFLUXDB_PORT}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - AI_MODEL_PATH=${AI_MODEL_PATH}
      - LOG_LEVEL=${LOG_LEVEL}
      - HEALTH_PORT=8080
    volumes:
      - ./logs/ai-softsensor:/logs/ai-softsensor
      - ./configs:/app/configs:ro
      - ./services/ai-softsensor/models:/app/models
    networks:
      - edge-network
    depends_on:
      - mosquitto
      - influxdb
    restart: always

  # ==================== AI 控制优化服务 ====================
  ai-ctrl-optimizer:
    build:
      context: .
      dockerfile: services/ai-ctrl-optimizer/Dockerfile
    container_name: ai-ctrl-optimizer
    environment:
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - INFLUXDB_HOST=${INFLUXDB_HOST}
      - INFLUXDB_PORT=${INFLUXDB_PORT}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - AI_MODEL_PATH=${AI_MODEL_PATH}
      - LOG_LEVEL=${LOG_LEVEL}
      - HEALTH_PORT=8080
    volumes:
      - ./logs/ai-ctrl-optimizer:/logs/ai-ctrl-optimizer
      - ./configs:/app/configs:ro
      - ./services/ai-ctrl-optimizer/models:/app/models
    networks:
      - edge-network
    depends_on:
      - mosquitto
      - influxdb
      - ai-softsensor
    restart: always

  # ==================== 授权服务 ====================
  license-service:
    build:
      context: .
      dockerfile: services/license-service/Dockerfile
    container_name: license-service
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - LICENSE_CHECK_ENABLED=${LICENSE_CHECK_ENABLED}
      - LICENSE_EXPIRY_DAYS=${LICENSE_EXPIRY_DAYS}
      - INFLUXDB_HOST=${INFLUXDB_HOST}
      - INFLUXDB_PORT=${INFLUXDB_PORT}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - ./logs/license-service:/logs/license-service
      - /dev/bus/usb:/dev/bus/usb  # USB 设备映射（加密狗）
    ports:
      - "${LICENSE_SERVICE_PORT}:8000"
    networks:
      - edge-network
    depends_on:
      - postgres
    privileged: true  # 需要访问 USB 设备
    restart: always

  # ==================== 系统监控服务 ====================
  edge-monitor:
    build:
      context: .
      dockerfile: services/edge-monitor/Dockerfile
    container_name: edge-monitor
    environment:
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - INFLUXDB_HOST=${INFLUXDB_HOST}
      - INFLUXDB_PORT=${INFLUXDB_PORT}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - LOG_LEVEL=${LOG_LEVEL}
      # 工业级告警：对接本地 Alertmanager（Prometheus 触发告警后可被 ops-console 展示）
      - ALERTMANAGER_BASE_URL=http://alertmanager:9093
    volumes:
      - ./logs/edge-monitor:/logs/edge-monitor
      - ./logs:/logs:ro
      - ./configs:/app/configs:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infra/discovery:/app/bootstrap
    networks:
      - edge-network
    ports:
      - "${EDGE_MONITOR_PORT:-8080}:8080"
    depends_on:
      - mosquitto
      - influxdb
    restart: always

  # ==================== Prometheus（指标采集/告警规则） ====================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: edge-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "9090:9090"
    networks:
      - edge-network
    depends_on:
      - edge-api
      - edge-daq
      - ai-softsensor
      - alertmanager
    restart: always

  # ==================== Alertmanager（告警聚合/查询） ====================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: edge-alertmanager
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093"
    networks:
      - edge-network
    restart: always

networks:
  edge-network:
    driver: bridge

volumes:
  postgres_data:
  influxdb_data:
  influxdb_config:
  mosquitto_data:
  mosquitto_logs:
  prometheus_data:
  alertmanager_data:
  tailscale_state:
  tailscale_run:

